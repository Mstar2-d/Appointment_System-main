{% extends "base.html" %}

{% block title %}Counselor Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Counselor Login</h2>
        <div class="mode-banner">
            Counselor Login Mode Active
        </div>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">
            Welcome back. Please enter your credentials to continue.
        </p>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 0.95rem;">
                Counselor Login
            </button>
        </form>
        <div class="auth-link" style="margin-top: 1.25rem;">
            <p><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
        </div>
    </div>
</div>
{% endblock %}
