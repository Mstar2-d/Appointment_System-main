{% extends "base.html" %}

{% block title %}Counselor Login{% endblock %}

{% block content %}
<style>
    /* Reduce container padding for login page to avoid scrolling */
    .container {
        padding-top: 1.5rem !important;
        padding-bottom: 1.5rem !important;
    }
</style>
<div class="auth-container">
    <div class="auth-card">
        <h2 style="margin-bottom: 1.25rem;">Counselor Login</h2>
        <div class="mode-banner" style="margin-bottom: 1.25rem;">
            Counselor Login Mode Active
        </div>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
            Welcome back. Please enter your credentials to continue.
        </p>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                    <button type="button" class="password-toggle" title="Toggle password visibility">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 0.95rem;">
                Counselor Login
            </button>
        </form>

        <div class="auth-divider">
            <span>OR</span>
        </div>

        <a href="{{ url_for('google_login') }}" class="btn btn-google" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 0.85rem; background: #fff; color: #444; border: 1px solid #dadce0; font-weight: 500; text-decoration: none; border-radius: 8px; transition: background 0.2s;">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                <path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.591.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </a>

        <div class="auth-link" style="margin-top: 1rem;">
            <p><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
        </div>
    </div>
</div>
{% endblock %}
